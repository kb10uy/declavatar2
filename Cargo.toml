[workspace]
resolver = "2"
members = ["da2","declavatar2"]

[workspace.package]
version = "0.1.0"
description = "Declarative Avatar Asset Composing Tool; Revised"
authors = ["kb10uy <kb10uy@kb10uy.org>"]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kb10uy/declavatar2"
readme = "README.md"

[workspace.dependencies]
cbindgen = "0.29.2"
declavatar2 = { path = "./declavatar2" }
either = "1.16.0"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
nalgebra = "0.35.0"
rstest = "0.26.1"
thiserror = "2.0.20"

[profile.release]
lto = "fat"
strip = "debuginfo"
